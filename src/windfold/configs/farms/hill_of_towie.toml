name = "hill_of_towie"
reader = "hill_of_towie"
turbine_type = "siemens_swt_2_3_82"

[dataset]
doi = "10.5281/zenodo.22662930"
concept_doi = "10.5281/zenodo.14870021"
version = "2.1.0"
licence = "CC-BY-4.0"
citation = "RES on behalf of TRIG (2026) Hill of Towie open dataset, version 2.1.0. Zenodo"

[windows]
calibration = { start = 2023-06-01T00:00:00Z, end = 2023-09-01T00:00:00Z }
development = { start = 2023-09-01T00:00:00Z, end = 2025-10-28T13:00:00Z, reason = "dynamic-yaw testing with wake steering starts at the end" }

[histories]
starts = [2023-09-01T00:00:00Z, 2023-12-01T00:00:00Z, 2024-03-01T00:00:00Z, 2024-06-01T00:00:00Z]
test = { start = 2025-06-08T00:00:00Z, end = 2025-10-28T13:00:00Z }

[northing]
farm_rotation = "wake_dips"

[[northing.provider_corrections]]
file = "companion/HOT_DY_Design_northing.yaml"
start = 2019-10-14T23:50:00Z

[source]
archives = "20*.zip"
turbines = "Hill_of_Towie_turbine_metadata.csv"
event_files = ["Hill_of_Towie_ShutdownDuration.zip"]

[channels]
power_kw = "tblSCTurGrid.wtc_ActPower_mean"
speed = "tblSCTurbine.wtc_PrWindSp_mean"
speed_std = "tblSCTurbine.wtc_PrWindSp_stddev"
wind_direction = "tblSCTurbine.wtc_ActualWindDirection_mean"
nacelle_position = "tblSCTurbine.wtc_NacelPos_mean"
ambient_temperature = "tblSCTurTemp.wtc_AmbieTmp_mean"
state_code_min = "tblSCTurbine.wtc_WTOperSt_min"
state_code_max = "tblSCTurbine.wtc_WTOperSt_max"
running_s = "tblSCTurFlag.wtc_ScInOper_timeon"
turbine_error_s = "tblSCTurFlag.wtc_ScTurSto_timeon"
environment_stop_s = "tblSCTurFlag.wtc_ScEnvSto_timeon"
communication_stop_s = "tblSCTurFlag.wtc_ScComSto_timeon"
grid_stop_s = "tblSCTurFlag.wtc_ScGrdSto_timeon"
setpoint_end_kw = "tblSCTurbine.wtc_PowerRef_endvalue"
wind_direction_min = "tblSCTurbine.wtc_ActualWindDirection_min"
wind_direction_max = "tblSCTurbine.wtc_ActualWindDirection_max"
nacelle_position_min = "tblSCTurbine.wtc_NacelPos_min"
nacelle_position_max = "tblSCTurbine.wtc_NacelPos_max"
speed_active = "tblSCTurbine.wtc_AcWindSp_mean"
speed_secondary = "tblSCTurbine.wtc_SeWindSp_mean"

[rules]
causal_offsets = false
fit_power_curve = true
state_codes = ["state_code_min", "state_code_max"]
running_seconds = "running_s"
min_running_seconds = 599.0
low_wind_states = ["1", "2", "3"]
stop_seconds = ["turbine_error_s", "environment_stop_s", "communication_stop_s", "grid_stop_s"]
setpoint_end = "setpoint_end_kw"
linear_mean_angles = [["wind_direction", "wind_direction_min", "wind_direction_max"], ["nacelle_position", "nacelle_position_min", "nacelle_position_max"]]

[rules.alarm_kinds]
"1005" = "stop"
"3130" = "stop"
"8000" = "stop"
"10105" = "stop"
"102" = "icing"
"8210" = "icing"
"8230" = "icing"
"8234" = "icing"
"8235" = "icing"
"8236" = "icing"

