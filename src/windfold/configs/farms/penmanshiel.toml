name = "penmanshiel"
reader = "greenbyte"
turbine_type = "senvion_mm82"

[dataset]
doi = "10.5281/zenodo.16807304"
concept_doi = "10.5281/zenodo.5946807"
licence = "CC-BY-4.0"
citation = "Plumley C, Takeuchi R (2025) Penmanshiel wind farm data. Zenodo"
acknowledgement = "the record asks users to tell Cubico how the data is used"

[windows]
calibration = { start = 2016-09-01T00:00:00Z, end = 2017-03-01T00:00:00Z }
development = { start = 2017-03-01T00:00:00Z, end = 2020-01-01T00:00:00Z }
confirmatory = { start = 2020-01-01T00:00:00Z, end = 2024-01-01T00:00:00Z }

[histories]
starts = [2017-04-01T00:00:00Z, 2017-07-01T00:00:00Z, 2017-10-01T00:00:00Z, 2018-01-01T00:00:00Z]
test = { start = 2019-01-08T00:00:00Z, end = 2020-01-01T00:00:00Z }

[confirmatory_histories]
starts = [2020-01-01T00:00:00Z, 2020-04-01T00:00:00Z, 2020-07-01T00:00:00Z, 2020-10-15T00:00:00Z]
test = { start = 2022-01-01T00:00:00Z, end = 2023-01-01T00:00:00Z }

[northing]
farm_rotation = "wake_dips"

[source]
archives = "Penmanshiel_SCADA_*.zip"
turbines = "Penmanshiel_WT_static.csv"
null_values = ["NaN"]
speed_missing_codes = [-15.0]

[channels]
power_kw = "Power (kW)"
speed = "Wind speed Sensor 2 (m/s)"
speed_std = "Wind speed Sensor 2, Standard deviation (m/s)"
wind_direction = "Wind direction (°)"
nacelle_position = "Nacelle position (°)"
ambient_temperature = "Nacelle ambient temperature (°C)"
speed_min = "Wind speed Sensor 2, Minimum (m/s)"
power_setpoint_kw = "Turbine Power setpoint (kW)"
power_setpoint_min_kw = "Turbine Power setpoint, Min (kW)"
time_based_availability = "Time-based System Avail."
downtime_loss_kwh = "Lost Production to Downtime (kWh)"

[rules]
fit_power_curve = false
availability = "time_based_availability"
downtime_loss = "downtime_loss_kwh"
setpoints = ["power_setpoint_min_kw", "power_setpoint_kw"]

[rules.status_kinds]
Stop = "stop"
Curtailment = "curtailment"
Communication = "unknown"

[[rules.message_kinds]]
status = "Warning"
message = "P output externally reduced"
kind = "derate"

[[rules.message_kinds]]
status = "Warning"
message = "Reduced power converter"
kind = "derate"

[[rules.message_kinds]]
status = "Warning"
message = "Reduced power gearbox"
kind = "derate"

[[rules.message_kinds]]
status = "Warning"
message = "Reduced power transformer"
kind = "derate"

[[rules.message_kinds]]
status = "Informational"
message = "Parameterized P red."
kind = "derate"

[[rules.message_kinds]]
status = "Informational"
message = "High frequency - P reduction"
kind = "derate"

[[rules.message_kinds]]
status = "Informational"
message = "Parameterized speed red."
kind = "derate"

[[rules.message_kinds]]
status = "Stop"
message = "Icing (anemometer)"
kind = "icing"

[[rules.message_kinds]]
status = "Stop"
message = "Icing (stop)"
kind = "icing"

[[rules.message_kinds]]
status = "Warning"
message = "Icing (dev. electr. power)"
kind = "icing"

[[rules.message_kinds]]
