name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --locked --extra cpu --group automl
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
      - run: uv build
      - name: the built wheel runs from an unrelated folder
        run: |
          uv venv /tmp/wheel-check --python 3.12
          uv pip install --python /tmp/wheel-check dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/windfold configs
          /tmp/wheel-check/bin/python - <<'EOF'
          import io
          from pathlib import Path

          from matplotlib import font_manager

          import windfold
          from windfold.report.style import load_style

          style = load_style()
          fonts = Path(windfold.__file__).parent / "report" / "fonts"
          family = style.report.type.family
          found = set()
          for weight in (400, 600):
              properties = font_manager.FontProperties(family=family, weight=weight)
              found.add(Path(font_manager.findfont(properties, fallback_to_default=False)))
          assert found == {fonts / name for name in style.report.type.files}, found
          with style.context():
              figure = style.figure(style.report.page.widths_mm[0], 40.0)
              figure.text(0.5, 0.5, "windfold")
              figure.savefig(io.BytesIO(), format="pdf")
          print(f"the report style and {family} load from {fonts}")
          EOF
